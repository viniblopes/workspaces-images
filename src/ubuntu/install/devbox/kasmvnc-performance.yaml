encoding:
  max_frame_rate: 60
  rect_encoding_mode:
    jpeg: 0
    webp: 9
  video_encoding_mode:
    jpeg: 0
    webp: 9
  
server:
  video:
    # Enable hardware encoding
    hw_encoder: true
    # Optimize for quality
    quality_level: 8
    # Reduce latency
    time: 3
    out_time: 3
    # Better area detection
    area: 50
    scaling: 0
  
  # Performance optimizations
  threads:
    rect: 4
  
  # Quality settings
  dynamic_quality_min: 7
  dynamic_quality_max: 9

network:
  ssl:
    pem_certificate: ${HOME}/.vnc/self.pem
    pem_key: ${HOME}/.vnc/self.pem
  udp:
    public_ip: 127.0.0.1

runtime_configuration:
  allow_override_standard_vnc_server_settings: true
  allow_override_list:
    - pointer.enabled

logging:
  log_writer_name: all
  log_dest: logfile
  level: 100
